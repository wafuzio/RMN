    <style>
      :root {
        --border-radius: 8px;
        --shadow: 4px;
        --desktop-height: 174px;
        --mobile-height: 126px;
        --mobile-logo-height: 50px;
        --font-family: 'Everyday Sans UI', Regular;
      }
      #WalmartActiveViewElement {
        overflow: hidden;
      }
      a.adctr {
        text-decoration: none;
      }
      #tile-container {
        height: calc(var(--mobile-height) + var(--shadow));
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #tile {
        margin: 2px 0 0 2px;
        position: relative;
        height: var(--mobile-height);
        border-radius: var(--border-radius);
        box-shadow: 0 1px 2px 1px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }
      #img, #copy-overlay, #copy {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        height: 100%;
      }
      #img {
        width: 100%;
        border-radius: var(--border-radius);
        z-index: 1;
        object-fit: cover;
        object-position: right;
      }
      #copy-overlay, #copy {
        width: 142px;
        box-sizing: border-box;
        border-top-left-radius: var(--border-radius);
        border-bottom-left-radius: var(--border-radius);
      }
      #copy-overlay {
        background: #ffffff;
        z-index: 2;
      }
      #copy {
        z-index: 3;
        padding: 16px;
        display: block;
      }
      #logo {
        width: 110px;
        height: var(--mobile-logo-height);
      }
      #accent-bar {
        display: none;
      }
      #copy-main {
        position: relative;
        font-family: var(--font-family);
        margin: 0;
        height: calc(100% - var(--mobile-logo-height));
      }
      #headline {
        font-size: 14px;
        font-weight: normal;
        position: absolute;
        bottom: 0;
        color: #2E2F32;
      }
      #subhead {
        display: none;
        color: #2E2F32;
      }
      #cta {
        display: none;
        position: absolute;
        bottom: 0;
        box-sizing: border-box;
        height: 40px;
        line-height: 40px;
        padding: 0 24px;
        box-shadow: inset 0 0 0 1px #2E2F32;
        border-radius: 100px;
        font-weight: 700;
        text-align: center;
        color: #2E2F32;
        background: #ffffff;
      }
      @media only screen and (min-width:429px) {
        #tile-container {
          height: calc(var(--desktop-height) + var(--shadow));
        }
        #tile {
          height: var(--desktop-height);
        }
        #img {
          margin: 0px;
        }
        #copy-overlay, #copy {
          width: 192px;
        }
        #headline {
          font-size: 20px;
          font-weight: bold;
        }
      }

      @media only screen and (min-width: 769px) {
        #copy-overlay, #copy {
          width: 448px;
        }
        #copy {
          padding: 16px;
          display: flex;
        }
        #logo {
          width: 100px;
          height: var(--mobile-height);
        }
        #accent-bar {
          display: block;
          width: 1px;
          margin: 0 24px;
          background: #f1f1f2;
        }
        #copy-main {
          width: 100%;
          height: auto;
        }
        #headline {
          position: relative;
        }
        #subhead {
          display: block;
          font-size: 16px;
        }
        #cta {
          display: block;
        }
      }

      @media only screen and (min-width: 1025px) {
        #copy-overlay, #copy {
          width: 477px;
        }
        #copy {
          padding: 24px;
        }
      }
      
      @font-face {
        font-family: 'Everyday Sans UI';
        src: url(https://i5.walmartimages.com/dfw/63fd9f59-581c/294cde33-8d74-4638-a582-6a0f942c0c18/v1/ESB.woff2) format("woff2");
        font-weight: 700;
      }

      @font-face {
        font-family: 'Everyday Sans UI';
        src: url(https://i5.walmartimages.com/dfw/63fd9f59-7d95/36d53a64-d69e-4b5d-aec5-5205e3b975f5/v1/ES.woff2) format("woff2");
        font-weight: 400;
      }
    </style>
