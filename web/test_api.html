<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Ad Monitor API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 0.9em;
        }
        
        select, button {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .results {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .results h2 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .ad-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            background: white;
        }
        
        .ad-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border-color: #667eea;
        }
        
        .ad-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }
        
        .ad-info {
            padding: 15px;
        }
        
        .ad-brand {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .ad-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-bottom: 8px;
        }
        
        .ad-keyword {
            color: #666;
            font-size: 0.9em;
            font-style: italic;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Retail Ad Monitor API Test</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="retailer">Retailer</label>
                <select id="retailer">
                    <option value="">Select retailer...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="client">Client</label>
                <select id="client" disabled>
                    <option value="">Select client...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="term">Search Term</label>
                <select id="term" disabled>
                    <option value="">All terms</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="loadBtn" disabled>Load Ad Cards</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="retailerCount">-</div>
                <div class="stat-label">Retailers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="clientCount">-</div>
                <div class="stat-label">Clients</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="runCount">-</div>
                <div class="stat-label">Runs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="cardCount">-</div>
                <div class="stat-label">Ad Cards</div>
            </div>
        </div>
        
        <div class="results">
            <h2>Results</h2>
            <div id="output">
                <div class="loading">Select a retailer and client to get started</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5006';
        
        const elements = {
            retailer: document.getElementById('retailer'),
            client: document.getElementById('client'),
            term: document.getElementById('term'),
            loadBtn: document.getElementById('loadBtn'),
            output: document.getElementById('output'),
            retailerCount: document.getElementById('retailerCount'),
            clientCount: document.getElementById('clientCount'),
            runCount: document.getElementById('runCount'),
            cardCount: document.getElementById('cardCount')
        };
        
        // Load retailers on page load
        async function loadRetailers() {
            try {
                const res = await fetch(`${API_BASE}/api/retailers`);
                const data = await res.json();
                
                elements.retailerCount.textContent = data.count;
                
                data.retailers.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r;
                    opt.textContent = r.charAt(0).toUpperCase() + r.slice(1);
                    elements.retailer.appendChild(opt);
                });
            } catch (err) {
                showError('Failed to load retailers: ' + err.message);
            }
        }
        
        // Load clients when retailer changes
        elements.retailer.addEventListener('change', async () => {
            const retailer = elements.retailer.value;
            elements.client.innerHTML = '<option value="">Select client...</option>';
            elements.client.disabled = !retailer;
            elements.term.innerHTML = '<option value="">All terms</option>';
            elements.term.disabled = true;
            elements.loadBtn.disabled = true;
            elements.clientCount.textContent = '-';
            elements.runCount.textContent = '-';
            
            if (!retailer) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/clients?retailer=${retailer}`);
                const data = await res.json();
                
                elements.clientCount.textContent = data.count;
                
                data.clients.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    elements.client.appendChild(opt);
                });
            } catch (err) {
                showError('Failed to load clients: ' + err.message);
            }
        });
        
        // Load terms and runs when client changes
        elements.client.addEventListener('change', async () => {
            const retailer = elements.retailer.value;
            const client = elements.client.value;
            elements.term.innerHTML = '<option value="">All terms</option>';
            elements.term.disabled = !client;
            elements.loadBtn.disabled = !client;
            
            if (!client) return;
            
            try {
                // Load terms
                const termsRes = await fetch(`${API_BASE}/api/terms?retailer=${retailer}&client=${client}`);
                const termsData = await termsRes.json();
                
                termsData.terms.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    elements.term.appendChild(opt);
                });
                
                // Load runs count
                const runsRes = await fetch(`${API_BASE}/api/runs?retailer=${retailer}&client=${client}`);
                const runsData = await runsRes.json();
                elements.runCount.textContent = runsData.count;
                
            } catch (err) {
                showError('Failed to load data: ' + err.message);
            }
        });
        
        // Load ad cards
        elements.loadBtn.addEventListener('click', async () => {
            const retailer = elements.retailer.value;
            const client = elements.client.value;
            const term = elements.term.value;
            
            elements.output.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                let url = `${API_BASE}/api/ads/cards?retailer=${retailer}&client=${client}&page=1&page_size=24`;
                if (term) url += `&term=${encodeURIComponent(term)}`;
                
                const res = await fetch(url);
                const data = await res.json();
                
                elements.cardCount.textContent = data.total_cards;
                
                if (data.cards.length === 0) {
                    elements.output.innerHTML = '<div class="loading">No ad cards found</div>';
                    return;
                }
                
                const grid = document.createElement('div');
                grid.className = 'card-grid';
                
                data.cards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'ad-card';
                    cardEl.innerHTML = `
                        <img src="${API_BASE}${card.image_url}" alt="${card.brand}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22250%22 height=%22200%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22250%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                        <div class="ad-info">
                            <div class="ad-brand">${card.brand}</div>
                            ${card.ad_type ? `<span class="ad-type">${card.ad_type}</span>` : ''}
                            <div class="ad-keyword">🔍 ${card.keyword || 'Unknown'}</div>
                        </div>
                    `;
                    grid.appendChild(cardEl);
                });
                
                elements.output.innerHTML = '';
                elements.output.appendChild(grid);
                
                if (data.has_more) {
                    const more = document.createElement('div');
                    more.style.textAlign = 'center';
                    more.style.marginTop = '20px';
                    more.style.color = '#666';
                    more.textContent = `Showing ${data.cards.length} of ${data.total_cards} cards`;
                    elements.output.appendChild(more);
                }
                
            } catch (err) {
                showError('Failed to load ad cards: ' + err.message);
            }
        });
        
        function showError(message) {
            elements.output.innerHTML = `<div class="error">${message}</div>`;
        }
        
        // Initialize
        loadRetailers();
    </script>
</body>
</html>
