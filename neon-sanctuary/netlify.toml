[build]
  command = "npm run build:client"
  publish = "dist/spa"

# Proxy all /api/* requests to the Flask backend via ngrok
[[redirects]]
  from = "/api/*"
  to = "https://foilable-ruthie-consultive.ngrok-free.dev/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    ngrok-skip-browser-warning = "1"

# SPA fallback: serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
